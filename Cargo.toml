[package]
name = "rx"
version = "0.2.0"
edition = "2024"
description = "Fast local CI and task runner for Rust workspaces"
license = "MIT"
rust-version = "1.85.0"
repository = "https://github.com/iPeluwa/rx"
homepage = "https://github.com/iPeluwa/rx"
readme = "README.md"
keywords = ["cargo", "build", "ci", "workspace", "task-runner"]
categories = ["development-tools", "development-tools::build-utils", "command-line-utilities"]
exclude = ["docs/", "editors/", "action/", ".github/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
owo-colors = "4"
ctrlc = "3"
serde_json = "1"
rayon = "1.10"
reflink-copy = "0.1"
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "fingerprint_bench"
harness = false
